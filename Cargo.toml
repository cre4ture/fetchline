[package]
edition      = "2024"
license      = "MIT"
name         = "fetchline"
rust-version = "1.88"
version      = "0.1.0"

[[bin]]
name = "fetchline"
path = "./src/bin/main.rs"

[dependencies]
base64ct = "1.8.3"
embassy-executor = { version = "0.10.0", features = ["log"] }
embassy-futures = "0.1.2"
embassy-net = { version = "0.9.1", features = [
  "dhcpv4",
  "log",
  "medium-ethernet",
  "tcp",
] }
embassy-sync = "0.8.0"
embassy-time = { version = "0.5.0", features = ["log"] }
embedded-graphics = "0.8.2"
embedded-io-async = "0.7.0"
esp-alloc = "0.10.0"
esp-bootloader-esp-idf = { version = "0.5.0", features = ["esp32c3", "log-04"] }
esp-backtrace = { version = "0.19.0", features = [
  "esp32c3",
  "panic-handler",
  "println",
] }
esp-hal = { version = "~1.1.0", features = ["esp32c3", "log-04", "unstable"] }
esp-println = { version = "0.17.0", default-features = false, features = [
  "critical-section",
  "esp32c3",
  "jtag-serial",
  "log-04",
] }
esp-rom-sys = { version = "0.1.4", features = ["esp32c3"] }
esp-radio = { version = "0.18.0", features = [
  "esp-alloc",
  "esp32c3",
  "log-04",
  "unstable",
  "wifi",
] }
esp-rtos = { version = "0.3.0", features = [
  "embassy",
  "esp-alloc",
  "esp-radio",
  "esp32c3",
  "log-04",
] }
log = "0.4.27"
fetchline-protocol = { path = "protocol" }
serde = { version = "1.0.229", default-features = false, features = ["derive"] }
serde-json-core = { version = "0.6.0", default-features = false, features = ["heapless"] }
sha1 = { version = "0.11.0", default-features = false }
ssd1306 = "0.10.0"
static_cell = "2.1.1"

# For fine tuning these settings, please refer to https://doc.rust-lang.org/cargo/reference/profiles.html
[profile.dev]
# The default debug profile is too slow and too big for resource-constrained devices.
# Always build with some optimizations enabled.
opt-level = "s"

[profile.release]
codegen-units = 1     # LLVM can perform better optimizations using a single thread
debug         = 2     # prefer slower builds but better debugging experience
lto           = 'fat'
opt-level     = 's'
