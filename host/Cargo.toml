[package]
name = "fetchline-host"
version = "0.1.0"
edition = "2024"
rust-version = "1.88"
license = "MIT"
description = "Local web control panel for Feetech STS servos behind fetchline"

[dependencies]
axum = { version = "0.8.8", features = ["ws"] }
fetchline-protocol = { path = "../protocol" }
log = "0.4.29"
serde = { version = "1.0.228", features = ["derive"] }
serde_json = "1.0.149"
tokio = { version = "1.49.0", features = ["io-util", "macros", "net", "rt-multi-thread", "sync", "time"] }

[dev-dependencies]
tempfile = "3.25.0"
tower = { version = "0.5.3", features = ["util"] }
